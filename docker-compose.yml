# =====================================================================
# docker-compose.yml — Infraestructura Completa del SaaS
# Incluye:
# 1. app-saas (FastAPI + Panel Web + Cerebro del Bot conectado a Neon.tech)
# 2. evolution-api (Conector WhatsApp Nivel 1 por Código QR)
# 3. redis (Caché de sesiones para Evolution API)
# =====================================================================
version: "3.9"

services:
  app-saas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas-whatsapp-bot
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - WHATSAPP_EVOLUTION_BASE_URL=http://evolution-api:8080
    volumes:
      - saas_uploads:/app/uploads
    depends_on:
      - evolution-api
    networks:
      - saas-network

  # --- Conector WhatsApp Nivel 1 (Escaneo de Código QR) ---
  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: saas-evolution-whatsapp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${WHATSAPP_EVOLUTION_API_KEY:-cambiar_esta_llave_en_env}
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/6
      - DATABASE_ENABLED=false
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://app-saas:8000/api/v1/whatsapp/webhook/evolution
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - redis
    networks:
      - saas-network

  redis:
    image: redis:7-alpine
    container_name: saas-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - saas-network

volumes:
  saas_uploads:
  evolution_instances:
  redis_data:

networks:
  saas-network:
    driver: bridge

