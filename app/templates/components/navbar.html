<!-- BARRA SUPERIOR (HEADER VERDE ABETO 30% + LOGO PROPIO ROJO TOMATE 10%) -->
<header class="ui-navbar sticky top-0 z-40 shadow-sm">
    <div class="max-w-[1440px] mx-auto px-3 sm:px-6 py-2.5 sm:py-3 flex items-center justify-between gap-2 sm:gap-3">
        <div class="flex items-center gap-2.5 sm:gap-3 min-w-0">
            <!-- Logo geométrico propio (burbuja + rayo de pedidos) -->
            <div class="ui-brand-logo w-9 h-9 sm:w-10 sm:h-10 rounded-xl flex items-center justify-center shrink-0">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                    <path d="M13 8l-3 5h4l-2 4"/>
                </svg>
            </div>
            <div class="min-w-0">
                <h1 class="font-extrabold text-sm sm:text-base tracking-tight text-white flex items-center gap-2 truncate">
                    OrdenaPro <span class="hidden sm:inline-flex text-[10px] uppercase px-2 py-0.5 rounded-full bg-white/15 text-[#F5EFE4] border border-white/20 font-bold">Multi-Comercio</span>
                </h1>
                <p class="hidden sm:block text-[11px] text-[#B2CABD] truncate">Gestión de Pedidos, Menú, Reservas &amp; Bot</p>
            </div>
        </div>

        <!-- Estado de Sesión, Toggle Modo Oscuro y Perfil Activo -->
        <div class="flex items-center gap-1.5 sm:gap-2.5 text-xs shrink-0">
            <button id="btnThemeToggle" type="button" onclick="toggleBrandTheme()"
                class="px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white keep-white border border-white/20 font-semibold transition flex items-center gap-1.5"
                title="Cambiar entre Modo Claro y Modo Oscuro">
                <i id="iconThemeToggle" class="fa-solid fa-moon text-[#FDE68A]"></i>
                <span id="lblThemeToggle" class="hidden md:inline">Oscuro</span>
            </button>

            <div id="userHeaderBox" class="hidden items-center gap-1.5 sm:gap-2.5 text-xs">
            <span id="userBadgeRole" class="hidden lg:inline-flex px-2.5 py-1 rounded-full font-bold bg-white/10 text-[#F5EFE4] border border-white/20"></span>
            <span id="userBadgeName" class="font-medium text-[#E4EFE9] hidden md:inline max-w-[140px] truncate"></span>
            <button id="btnOpen2FA" type="button" onclick="openModal2FA()" class="px-2.5 sm:px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white border border-white/20 font-semibold transition flex items-center gap-1.5" title="Configurar autenticacion en dos pasos (2FA)">
                <i class="fa-solid fa-shield-halved text-[#86EFAC]"></i> <span id="lblBtn2FA" class="hidden md:inline">Seguridad 2FA</span>
            </button>
            <button id="btnVolverSuperAdmin" onclick="switchBackToSuperAdmin()" class="hidden px-2.5 sm:px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25 text-white border border-white/25 font-bold transition flex items-center gap-1.5" title="Volver al Panel Maestro">
                <i class="fa-solid fa-arrow-left"></i> <span class="hidden sm:inline">Panel Maestro</span>
            </button>
            <button onclick="logout()" class="px-2.5 sm:px-3 py-1.5 rounded-lg bg-[#D6402B] hover:bg-[#B8321F] text-white font-semibold transition flex items-center gap-1.5 shadow-sm" title="Cerrar sesión">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> <span class="hidden sm:inline">Salir</span>
            </button>
            </div>
        </div>
    </div>
</header>
