<!-- BARRA SUPERIOR (HEADER) -->
<header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-300 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-emerald-500/20">
                <i class="fa-brands fa-whatsapp text-2xl"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-base tracking-tight text-white flex items-center gap-2">
                    WhatsApp SaaS <span class="text-[10px] uppercase px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-bold">v2.0 PRO</span>
                </h1>
                <p class="text-[11px] text-slate-400">Bot Multi-Tenant • Pedidos, Menú & Inventario</p>
            </div>
        </div>

        <!-- Estado de Sesión y Perfil Activo -->
        <div id="userHeaderBox" class="hidden items-center gap-3 text-xs">
            <span id="userBadgeRole" class="px-2.5 py-1 rounded-full font-bold bg-slate-800 text-slate-200 border border-slate-700"></span>
            <span id="userBadgeName" class="font-medium text-slate-300 hidden sm:inline"></span>
            <button id="btnOpen2FA" type="button" onclick="openModal2FA()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold transition flex items-center gap-1.5" title="Configurar autenticacion en dos pasos (2FA)">
                <i class="fa-solid fa-shield-halved text-emerald-400"></i> <span id="lblBtn2FA">Seguridad 2FA</span>
            </button>
            <button id="btnVolverSuperAdmin" onclick="switchBackToSuperAdmin()" class="hidden px-3 py-1.5 rounded-lg bg-indigo-500/20 text-indigo-300 hover:bg-indigo-500/30 border border-indigo-500/40 font-bold transition flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-left"></i> <span>Volver al Panel Maestro</span>
            </button>
            <button onclick="logout()" class="px-3 py-1.5 rounded-lg bg-rose-500/15 text-rose-300 hover:bg-rose-500/25 border border-rose-500/30 font-semibold transition flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> <span>Cerrar Sesión</span>
            </button>
        </div>
    </div>
</header>
