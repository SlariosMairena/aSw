<!-- Encabezado del Restaurante y Filtro Multi-Sucursal -->
<div class="glass rounded-2xl p-5 flex flex-wrap items-center justify-between gap-4">
    <div>
        <div class="flex items-center gap-2.5">
            <h2 id="comercioTitle" class="text-2xl font-bold text-white">Cargando Restaurante...</h2>
            <span id="comercioPlanBadge" class="text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-semibold"></span>
        </div>
        <p id="comercioSubInfo" class="text-xs text-slate-400 mt-1"></p>
    </div>

    <div class="flex flex-wrap items-center gap-3">
        <div>
            <label class="block text-[11px] text-slate-400 uppercase font-semibold mb-1">Sucursal Activa:</label>
            <select id="filtroSucursalSelect" onchange="reloadComercioDashboard()"
                class="px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white font-semibold">
                <option value="">Todas las sucursales</option>
            </select>
        </div>
        <button onclick="openConfigComercioModal()" title="Configuración de Moneda (C$), Nombre y Formas de Pago"
            class="px-3.5 py-2 rounded-xl bg-indigo-500/20 hover:bg-indigo-500/30 border border-indigo-500/40 text-indigo-300 text-xs font-semibold transition flex items-center gap-1.5">
            <span>⚙️</span> <span>Moneda & Negocio</span> (<span id="headerMonedaBadge" class="font-extrabold text-emerald-400">C$</span>)
        </button>
        <button onclick="playKitchenBell()" title="Probar campana sonora de cocina"
            class="px-3.5 py-2 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-300 text-xs font-semibold transition">
            🔔 Probar Sonido Cocina
        </button>
        <button onclick="reloadComercioDashboard()"
            class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 text-xs font-semibold transition">
            🔄 Actualizar Tablero
        </button>
    </div>
</div>

<!-- Navegación por Pestañas del Restaurante -->
<div class="flex flex-wrap gap-2 border-b border-slate-800 pb-3">
    <button onclick="switchComercioTab('pedidos')" id="tabBtn_pedidos"
        class="px-4 py-2 rounded-xl text-sm font-bold bg-emerald-500 text-slate-950 transition flex items-center gap-1.5">
        <span>📋</span> <span>Tablero de Pedidos</span>
    </button>
    <button onclick="switchComercioTab('menu')" id="tabBtn_menu"
        class="px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1.5">
        <span>🍔</span> <span>Menú, Precios y Extras</span>
    </button>
    <button onclick="switchComercioTab('inventario')" id="tabBtn_inventario"
        class="px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1.5">
        <span>📦</span> <span>Control de Inventario</span>
        <span id="tabBadgeBajoStock" class="hidden text-[10px] px-1.5 py-0.2 rounded-full bg-amber-500 text-slate-950 font-black">!</span>
    </button>
    <button onclick="switchComercioTab('sucursales')" id="tabBtn_sucursales"
        class="px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1.5">
        <span>📲</span> <span>WhatsApp por Sucursal & Mesas</span>
    </button>
</div>
