<!-- PESTANA: DIRECTORIO DE CLIENTES FRECUENTES -->
<div id="tabContent_clientes" class="hidden space-y-5">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-address-book text-cyan-400"></i> Directorio de Clientes Frecuentes
            </h3>
            <p class="text-xs text-slate-400 mt-1">
                Consulta historiales de pedidos, direcciones guardadas y usa sus datos con un clic en el mostrador POS.
            </p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass text-slate-500 absolute left-3 top-2.5 text-xs"></i>
                <input type="text" id="clientesSearchInput" oninput="cargarClientesComercio()" placeholder="Buscar por nombre o telefono..."
                    class="bg-slate-950 border border-slate-700 rounded-xl pl-8 pr-3 py-2 text-xs text-white focus:border-cyan-500 outline-none w-60">
            </div>
            <button type="button" onclick="toggleNuevoClienteForm()" class="px-3.5 py-2 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold flex items-center gap-1.5">
                <i class="fa-solid fa-user-plus"></i> Nuevo Cliente
            </button>
        </div>
    </div>

    <!-- Formulario Rapido Nuevo Cliente -->
    <form id="formNuevoClienteRapido" onsubmit="handleCrearClienteRapido(event)" class="hidden bg-slate-900 border border-cyan-500/40 rounded-2xl p-4 grid grid-cols-1 md:grid-cols-12 gap-3 items-end">
        <div class="md:col-span-3">
            <label class="block text-[11px] text-slate-400 mb-1">Nombre Completo *</label>
            <input type="text" id="cliNuevoNombre" required placeholder="Ej. Maria Lopez"
                class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none">
        </div>
        <div class="md:col-span-3">
            <label class="block text-[11px] text-slate-400 mb-1">Telefono WhatsApp *</label>
            <input type="text" id="cliNuevoTelefono" required placeholder="+5255..."
                class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none">
        </div>
        <div class="md:col-span-4">
            <label class="block text-[11px] text-slate-400 mb-1">Direccion Habitual</label>
            <input type="text" id="cliNuevoDireccion" placeholder="Calle, numero, referencia"
                class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none">
        </div>
        <div class="md:col-span-2 flex gap-2">
            <button type="submit" class="w-full px-3 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold">
                Guardar
            </button>
        </div>
    </form>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs">
                <thead class="bg-slate-950 text-slate-400 uppercase">
                    <tr>
                        <th class="px-4 py-3">Cliente</th>
                        <th class="px-4 py-3">WhatsApp</th>
                        <th class="px-4 py-3">Ultima Direccion / Zona</th>
                        <th class="px-4 py-3 text-center">Pedidos</th>
                        <th class="px-4 py-3 text-right">Acciones</th>
                    </tr>
                </thead>
                <tbody id="clientesTableBody" class="divide-y divide-slate-800"></tbody>
            </table>
        </div>
    </div>
</div>
