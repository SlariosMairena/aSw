<!-- ========================================================= -->
<!-- MODAL: VER RESUMEN IA, CHAT DE WHATSAPP Y TOMAR CONTROL    -->
<!-- ========================================================= -->
<div id="chatModal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass max-w-2xl w-full rounded-2xl p-6 shadow-2xl border border-slate-700 max-h-[90vh] flex flex-col">
        <div class="flex items-center justify-between pb-3 border-b border-slate-800">
            <div>
                <h3 id="modalChatTitle" class="text-lg font-bold text-white">Chat de WhatsApp del Pedido</h3>
                <p id="modalChatSubtitle" class="text-xs text-slate-400"></p>
            </div>
            <button onclick="closeChatModal()" class="text-slate-400 hover:text-white text-xl font-bold px-2">✕</button>
        </div>

        <!-- Interruptor para Tomar el Control de la Conversación (Human Handoff) -->
        <div class="my-3 p-3.5 rounded-xl bg-slate-900 border border-slate-700 flex flex-wrap items-center justify-between gap-3">
            <div>
                <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Estado de este Chat en WhatsApp:</span>
                <div id="modalChatModeBadge" class="text-sm font-bold mt-0.5"></div>
            </div>
            <div class="flex gap-2">
                <button id="btnTakeControl" onclick="toggleChatControl('HUMANO_ACTIVO')"
                    class="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs transition">
                    🛑 Tomar Control Humano (Pausar Bot aquí)
                </button>
                <button id="btnReleaseControl" onclick="toggleChatControl('BOT_ACTIVO')"
                    class="px-3.5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-xs transition">
                    🤖 Reactivar Bot para este Chat
                </button>
            </div>
        </div>

        <!-- Resumen IA y Cómo se realizó el pedido -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3 text-xs">
            <div class="p-3 rounded-xl bg-indigo-950/40 border border-indigo-500/30">
                <div class="font-bold text-indigo-300 mb-1">🧠 Resumen del Chat (Generado por IA):</div>
                <p id="modalResumenIA" class="text-slate-200 leading-relaxed"></p>
            </div>
            <div class="p-3 rounded-xl bg-emerald-950/40 border border-emerald-500/30">
                <div class="font-bold text-emerald-300 mb-1">📋 Cómo se realizó este pedido:</div>
                <p id="modalComoSeRealizo" class="text-slate-200 leading-relaxed"></p>
            </div>
        </div>

        <!-- Historial de Mensajes de WhatsApp -->
        <div id="modalMessagesList" class="flex-1 overflow-y-auto space-y-2.5 p-3 rounded-xl bg-slate-950/70 border border-slate-800 text-xs min-h-[180px]"></div>

        <!-- Enviar Mensaje Manual desde la Web al WhatsApp del Cliente -->
        <form onsubmit="handleSendHumanMessage(event)" class="mt-3 flex gap-2">
            <input id="inputHumanMessage" type="text" required
                placeholder="Escribe aquí para responderle manualmente al cliente en su WhatsApp..."
                class="flex-1 px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs focus:outline-none focus:border-amber-500">
            <button type="submit"
                class="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs transition">
                Enviar a WhatsApp ➔
            </button>
        </form>
    </div>
</div>
