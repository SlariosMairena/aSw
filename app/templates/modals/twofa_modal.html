<!-- MODAL DE SEGURIDAD 2FA (TOTP) -->
<div id="modalSeguridad2FA" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-5">
            <h3 class="font-bold text-lg text-white flex items-center gap-2">
                <i class="fa-solid fa-shield-halved text-emerald-400"></i> Seguridad 2FA (Google Authenticator)
            </h3>
            <button type="button" onclick="cerrarModal2FA()" class="text-slate-400 hover:text-white text-xl leading-none">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div id="twofaStatusBanner" class="mb-4 p-3 rounded-xl border text-xs flex items-center gap-2">
            <i class="fa-solid fa-circle-info"></i>
            <span id="twofaStatusText">Verificando estado...</span>
        </div>

        <div id="twofaSetupArea" class="space-y-4">
            <div class="text-center bg-slate-950/70 border border-slate-800 rounded-2xl p-4">
                <p class="text-xs text-slate-300 mb-3">
                    Escanea este codigo QR desde Google Authenticator, Authy o Microsoft Authenticator.
                </p>
                <div id="twofaQrWrapper" class="inline-flex items-center justify-center bg-white p-3 rounded-xl min-w-[160px] min-h-[160px]">
                    <span class="text-xs text-slate-500">Generando QR...</span>
                </div>
                <div class="mt-3">
                    <span class="text-[11px] text-slate-400 block mb-1">Clave secreta manual:</span>
                    <code id="twofaManualSecret" class="text-xs font-mono text-amber-300 bg-slate-900 border border-slate-700 px-3 py-1 rounded-lg select-all">---</code>
                </div>
            </div>

            <form id="formActivar2FA" onsubmit="handleActivar2FA(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Codigo de verificacion (6 digitos)</label>
                    <input type="text" id="twofaTotpCode" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required
                        placeholder="000000"
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-center tracking-[0.4em] font-mono text-lg text-white focus:border-emerald-500 outline-none">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="cerrarModal2FA()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-semibold">
                        Cerrar
                    </button>
                    <button type="submit" id="btnConfirmar2FA" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center gap-1.5">
                        <i class="fa-solid fa-check"></i> Activar 2FA
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
