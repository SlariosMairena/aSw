<!-- MODAL GLOBAL DE CONFIRMACIÓN Y ENTRADA (REEMPLAZA confirm() / prompt() NATIVOS) -->
<div id="uiDialogModal" class="hidden fixed inset-0 z-[90] bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="uiDialogTitle">
    <div class="glass max-w-md w-full rounded-2xl p-5 sm:p-6 shadow-2xl border border-slate-700/60 space-y-4">
        <div class="flex items-start gap-3.5">
            <div id="uiDialogIconWrap" class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 bg-emerald-500/15 text-emerald-500 border border-emerald-500/25">
                <i id="uiDialogIcon" class="fa-solid fa-circle-question text-base"></i>
            </div>
            <div class="min-w-0 flex-1">
                <h3 id="uiDialogTitle" class="text-base font-extrabold text-slate-100 leading-snug">Confirmar acción</h3>
                <p id="uiDialogMessage" class="text-xs text-slate-400 mt-1 leading-relaxed"></p>
            </div>
            <button type="button" id="uiDialogCloseBtn" class="text-slate-400 hover:text-slate-200 transition p-1 -mt-1 -mr-1" aria-label="Cerrar">
                <i class="fa-solid fa-xmark text-base"></i>
            </button>
        </div>

        <form id="uiDialogForm" class="space-y-4">
            <div id="uiDialogInputWrap" class="hidden space-y-1.5">
                <label id="uiDialogInputLabel" for="uiDialogInput" class="block text-xs font-bold text-slate-300"></label>
                <div class="relative">
                    <input id="uiDialogInput" type="text"
                        class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-emerald-500 transition pr-10"
                        autocomplete="off">
                    <button type="button" id="uiDialogTogglePass" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 px-1.5 py-1 transition" title="Mostrar u ocultar contraseña">
                        <i id="uiDialogTogglePassIcon" class="fa-solid fa-eye text-xs"></i>
                    </button>
                </div>
                <p id="uiDialogError" class="hidden text-[11px] font-semibold text-rose-400"></p>
            </div>

            <div class="flex items-center justify-end gap-2 pt-1">
                <button type="button" id="uiDialogCancelBtn"
                    class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-bold text-xs transition">
                    Cancelar
                </button>
                <button type="submit" id="uiDialogConfirmBtn"
                    class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs transition shadow-sm flex items-center gap-1.5">
                    <span id="uiDialogConfirmLabel">Confirmar</span>
                </button>
            </div>
        </form>
    </div>
</div>
